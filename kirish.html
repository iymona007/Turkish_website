<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirish | Türkçe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <a href="index.html" class="logo">
      <span class="logo-icon">C</span>
      <span>Türkçe</span>
    </a>

    <h1>Hisobga kirish</h1>
    <p class="auth-sub">Qaytganingizdan xursandmiz! Davom eting.</p>

    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" placeholder="email@example.com" required>

      <label>Parol</label>
      <input type="password" id="password" placeholder="Parolingiz" required>

      <p class="form-error" id="error"></p>

      <button type="submit" class="btn btn-red full">Kirish</button>
    </form>

    <p class="auth-switch">Hisobingiz yo'qmi? <a href="royxat.html">Ro'yxatdan o'tish</a></p>
  </div>

  <script src="auth.js"></script>
  <script src="nav.js"></script>
</body>
</html>
