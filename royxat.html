<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ro'yxatdan o'tish | Türkçe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <a href="index.html" class="logo">
      <span class="logo-icon">C</span>
      <span>Türkçe</span>
    </a>

    <h1>Hisob yaratish</h1>
    <p class="auth-sub">Turk tilini o'rganishni bugun boshlang.</p>

    <form id="registerForm">
      <label>Ismingiz</label>
      <input type="text" id="name" placeholder="Ismingiz" required>

      <label>Email</label>
      <input type="email" id="email" placeholder="email@example.com" required>

      <label>Parol</label>
      <input type="password" id="password" placeholder="Kamida 6 ta belgi" required>

      <label>Parolni takrorlang</label>
      <input type="password" id="password2" placeholder="Parolni qayta yozing" required>

      <p class="form-error" id="error"></p>

      <button type="submit" class="btn btn-red full">Ro'yxatdan o'tish</button>
    </form>

    <p class="auth-switch">Hisobingiz bormi? <a href="kirish.html">Kirish</a></p>
  </div>

  <script src="auth.js"></script>
  <script src="nav.js"></script>
</body>
</html>
