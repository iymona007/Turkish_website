<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testlar | Türkçe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">
      <span class="logo-icon">C</span>
      <span>Türkçe</span>
    </a>
    <nav class="nav">
      <a href="index.html">Bosh sahifa</a>
      <a href="index.html">Bosh sahifa</a>
      <a href="dashboard.html" class="active">🏠 Bosh sahifa</a>
      <a href="profil.html">👤 Profil</a>

    </nav>
    <div class="auth">
      <a href="kirish.html" class="login">Kirish</a>
      <a href="royxat.html" class="btn btn-red">Ro'yxatdan o'tish</a>
    </div>
  </header>

  <main class="quiz-page">
    <div class="quiz-box" id="quizBox">

      <div class="quiz-top">
        <span id="qCount">1 / 5</span>
        <span id="qScore">⭐ 0</span>
      </div>
      <div class="progress"><div class="progress-bar" id="qBar"></div></div>

      <div id="questionArea">
        <p class="q-label" id="qLabel">Bu so'zning tarjimasi nima?</p>
        <h2 id="qWord"></h2>
        <button class="speak-btn big" id="qSpeak">🔊</button>
        <div class="options" id="options"></div>
      </div>

      <div class="quiz-footer">
        <span id="feedback"></span>
        <button class="btn btn-red" id="qNext" disabled>Keyingi</button>
      </div>
    </div>

    <select id="levelSelect">
    <option value="all">Barcha darajalar</option>
    <option value="A1">A1 — Boshlang‘ich</option>
    <option value="A2">A2 — Asosiy</option>
    <option value="B1">B1 — O‘rta</option>
    <option value="B2">B2 — Yuqoriroq</option>
  </select>

  <select id="dirSelect">
    <option value="mix">Aralash</option>
    <option value="tr-uz">Turkcha → O'zbekcha</option>
    <option value="uz-tr">O'zbekcha → Turkcha</option>
  </select>

    <div class="quiz-box result" id="resultBox" hidden>
      <div class="result-emoji" id="resEmoji">🎉</div>
      <h2 id="resTitle"></h2>
      <p id="resText"></p>
      <div class="result-buttons">
        <button class="btn btn-red" id="restart">Qayta boshlash</button>
        <a href="dashboard.html" class="btn btn-light">Bosh sahifa</a>
      </div>
    </div>
  </main>
  <script>
    window.addEventListener("error", function (e) {
      var matn = e.target && e.target.src
        ? "Fayl topilmadi: " + e.target.src
        : "Xato: " + e.message + " (" + (e.filename || "").split("/").pop() + ":" + e.lineno + ")";
      var d = document.createElement("div");
      d.style.cssText = "background:#fee;color:#900;padding:12px;margin:12px;border-radius:8px;font-size:14px";
      d.textContent = matn;
      document.body.prepend(d);
    }, true);
  </script>
  <script src="nav.js"></script>
  <script src="samimiy.js"></script>
  <script src="rasmiy.js"></script>
  <script src="testlar.js"></script>
</body>
</html>
