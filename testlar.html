<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testlar | Türkçe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">
      <span class="logo-icon">C</span>
      <span>Türkçe</span>
    </a>
    <nav class="nav">
      <a href="index.html">Bosh sahifa</a>
      <a href="darslar.html">Darslar</a>
      <a href="sozlar.html">So'zlar</a>
      <a href="rasmiy.html">Rasmiy</a>
      <a href="samimiy.html">Samimiy</a>
      <a href="mashqlar.html">Mashqlar</a>
      <a href="testlar.html">Testlar</a>
      <a href="biz_haqimizda.html">Biz haqimizda</a>
    </nav>
    <div class="auth">
      <a href="kirish.html" class="login">Kirish</a>
      <a href="royxat.html" class="btn btn-red">Ro'yxatdan o'tish</a>
    </div>
  </header>

  <main class="quiz-page">
    <div class="quiz-box" id="quizBox">

      <div class="quiz-top">
        <span id="qCount">1 / 5</span>
        <span id="qScore">⭐ 0</span>
      </div>
      <div class="progress"><div class="progress-bar" id="qBar"></div></div>

      <div id="questionArea">
        <p class="q-label">Bu so'zning tarjimasi nima?</p>
        <h2 id="qWord"></h2>
        <button class="speak-btn big" id="qSpeak">🔊</button>
        <div class="options" id="options"></div>
      </div>

      <div class="quiz-footer">
        <span id="feedback"></span>
        <button class="btn btn-red" id="qNext" disabled>Keyingi</button>
      </div>
    </div>

    <div class="quiz-box result" id="resultBox" hidden>
      <div class="result-emoji" id="resEmoji">🎉</div>
      <h2 id="resTitle"></h2>
      <p id="resText"></p>
      <div class="result-buttons">
        <button class="btn btn-red" id="restart">Qayta boshlash</button>
        <a href="dashboard.html" class="btn btn-light">Bosh sahifa</a>
      </div>
    </div>
  </main>

  <script src="nav.js"></script>
  <script src="testlar.js"></script>
</body>
</html>
